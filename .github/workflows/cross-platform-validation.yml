name: Cross-platform source validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  source-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact build versions
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run source smoke and performance gate
        run: |
          python main.py --smoke-test
          python tools/benchmark_catalog.py --check
      - name: Validate native build script syntax
        run: bash -n "platforms/${RUNNER_OS,,}/build_${RUNNER_OS,,}.sh"
        if: runner.os == 'Linux'
      - name: Validate macOS build script syntax
        run: bash -n platforms/macos/build_macos.sh
        if: runner.os == 'macOS'
