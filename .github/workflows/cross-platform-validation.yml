name: Cross-platform source validation

on:
  push:
    branches: [main, codex/audit-optimizations]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install exact build versions
        run: python -m pip install -r requirements-build.txt
      - name: Install Linux native accessibility contract prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libatk1.0-dev
      - name: Run tests
        run: python -B tools/run_tests.py
      - name: Run source smoke and performance gate
        run: |
          python main.py --smoke-test
          python tools/benchmark_catalog.py --check
          python -B tools/evaluate_corpus.py
      - name: Validate native build script syntax
        run: bash -n "platforms/${RUNNER_OS,,}/build_${RUNNER_OS,,}.sh"
        if: runner.os == 'Linux'
      - name: Validate macOS build script syntax
        run: bash -n platforms/macos/build_macos.sh
        if: runner.os == 'macOS'
