name: Python dependency audit
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit locked Python packages and generate inventory
        run: python -m pip_audit -r requirements.lock --no-deps --disable-pip -f cyclonedx-json -o python-sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-dependency-inventory
          path: python-sbom.json
