name: Native macOS and Linux packages

on:
  push:
    branches: [codex/audit-optimizations]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:
    inputs:
      native_revision:
        description: Native supplement number; an existing release is never overwritten
        type: string
        default: '2'
      publish:
        description: Publish the validated native supplement (never overwrite a release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  native-build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Install Linux build/runtime prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build xvfb libtk8.6 tcl-dev libglib2.0-dev patchelf libx11-dev libxft-dev libxext-dev libxss-dev libharfbuzz-dev libatk-bridge2.0-dev at-spi2-core dbus-x11 orca openbox
          # Refresh the Ubuntu runtime families observed in the native payload,
          # before freezing. Runner images can retain superseded source versions
          # (observed: systemd and xz-utils). The collector still requires the
          # exact source version of every binary actually selected by Analysis.
          runtime_packages=(
            libsystemd0 liblzma5 libzstd1 zlib1g libexpat1 libssl3 libsqlite3-0
            libcap2 libgcrypt20 libgpg-error0 libdbus-1-3 libfreetype6 libfontconfig1
            libglib2.0-0 libharfbuzz0b libpng16-16 libbrotli1 libbsd0 libmd0 libpcre3
            libuuid1 libffi8 libbz2-1.0 liblz4-1 libgcc-s1 libstdc++6 libtinfo6
            libx11-6 libxau6 libxdmcp6 libxcb1 libxext6 libxft2 libxi6 libxrender1
            libxss1 libatspi2.0-0 libatk-bridge2.0-0 libatk1.0-0
          )
          sudo apt-get install -y --no-install-recommends --only-upgrade "${runtime_packages[@]}"
          dpkg-query --show --showformat='${binary:Package}\t${Version}\t${source:Package}\t${source:Version}\n' "${runtime_packages[@]}"
      - name: Resolve and hash-lock native Python wheels
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-build.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python tools/lock_native_wheels.py
      - name: Build pinned accessible Tcl and Tk runtime
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python3 tools/build_accessible_tk.py --output dist/native-gui
          else
            python3 tools/build_accessible_tk.py --output dist/native-gui
          fi
      - name: Build pinned OCR without JBIG or GPL/LGPL OCR libraries
        run: python3 tools/bundle_native_ocr.py
      - name: Check unchanged inputs, seven image formats, all languages and TSV
        run: python3 tools/verify_ocr_functionality.py platforms/${{ matrix.platform }}/tesseract --output dist/ocr-formats.json
      - name: Verify native accessibility properties and actions
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a python3 tools/verify_accessibility.py --output dist/accessibility-self-test.json
          else
            python3 tools/verify_accessibility.py --output dist/accessibility-self-test.json
          fi
      - name: Build and test Linux frozen application
        id: linux_build
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- xvfb-run -a bash platforms/linux/build_linux.sh
      - name: Check real Orca presentation without audio in isolated Linux CI
        id: orca_check
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.linux_build.outcome == 'success' }}
        run: |
          GSETTINGS_BACKEND=memory MYL_ISOLATED_A11Y_CI=1 dbus-run-session -- xvfb-run -a python3 -B tools/verify_orca_accessibility.py --executable dist/linux/ManageYourLibrary/ManageYourLibrary --output dist/orca-accessibility.json
      - name: Retain normalized external reader evidence
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orca-presentation-linux-x64
          path: dist/orca-accessibility.json
          if-no-files-found: ignore
      - name: Collect exact Ubuntu library notices and corresponding source
        id: linux_sources
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.linux_build.outcome == 'success' }}
        run: |
          python3 -B tools/collect_linux_license_evidence.py --pyinstaller-toc dist/linux-binary-inputs.toc --output dist/linux-license-evidence
      - name: Verify source tar on a disposable application copy
        id: linux_source_review
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.linux_sources.outcome == 'success' }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          MYL_ISOLATED_SOURCE_CI=1 python3 -B tools/verify_linux_source_package.py --payload dist/linux/ManageYourLibrary --evidence dist/linux-license-evidence --output dist/linux-source-review --label "ManageYourLibrary-${version}-Linux-x64-source-review"
      - name: Retain independent source writer evidence
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-review-linux-x64
          path: dist/linux-source-review/*
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - name: Check modified GLib loading in a disposable application copy
        id: linux_replacement
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.linux_sources.outcome == 'success' }}
        run: |
          GSETTINGS_BACKEND=memory MYL_ISOLATED_A11Y_CI=1 dbus-run-session -- xvfb-run -a python3 -B tools/verify_linux_library_replacement.py --payload dist/linux/ManageYourLibrary --evidence dist/linux-license-evidence --output dist/linux-library-replacement.json
      - name: Package and re-test Linux archive with source evidence
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python3 tools/package_native_release.py --platform linux
      - name: Build and test macOS frozen application and archive
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bash platforms/macos/build_macos.sh
          python3 tools/package_native_release.py --platform macos
      - name: Retain native packages and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/native-release/*
          if-no-files-found: error
          compression-level: 0
      - name: Retain normalized library replacement evidence
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-library-replacement-x64
          path: dist/linux-library-replacement.json
          if-no-files-found: ignore
      - name: Retain failed diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/**/runtime-self-test.json
            dist/**/first-use-self-test.json
            dist/**/extracted-*-self-test.json
            dist/accessibility-self-test.json
          if-no-files-found: ignore

  publish:
    needs: native-build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          merge-multiple: true
          path: native-artifacts
      - name: Publish only complete verified native packages
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NATIVE_REVISION: ${{ inputs.native_revision }}
        run: |
          set -euo pipefail
          python3 tools/check_native_publication_licenses.py native-artifacts
          cd native-artifacts
          for checksums in *-SHA256SUMS.txt; do sha256sum -c "$checksums"; done
          test "$(find . -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find . -name '*.zip' | wc -l)" -eq 2
          cd ..
          [[ "$NATIVE_REVISION" =~ ^[1-9][0-9]*$ ]]
          tag="v$(tr -d '\r\n' < VERSION)-native.$NATIVE_REVISION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          cp docs/NATIVE_FIRST_USE.md native-notes.md
          printf '\nSource revision: `%s`\n\nNative build and checks: %s\n\nThis supplement does not replace the Windows v0.5.3 release.\n' "$SOURCE_SHA" "$RUN_LINK" >> native-notes.md
          gh release create "$tag" native-artifacts/* --target "$SOURCE_SHA" --title '0.5.3 — macOS and Linux native packages' --notes-file native-notes.md --draft --latest=false
          gh release edit "$tag" --draft=false --latest=false
