name: Native updater candidates (DG-0035)

on:
  workflow_dispatch:
    inputs:
      android_bundle_run_id:
        description: Optional Actions run containing a verified signed Android build input
        type: string
        default: ''
      android_artifact_name:
        description: Artifact name in that run; release signing identity is verified before use
        type: string
        default: signed-android-build-input
  push:
    branches: ['codex/dg-0035-native-*']

# Candidate validation cannot create releases, change channels or update devices.
permissions:
  contents: read
  actions: read

jobs:
  android-input:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare SDK verifier
        shell: pwsh
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Download approved signed Android input when supplied
        if: inputs.android_bundle_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.android_bundle_run_id }}
          name: ${{ inputs.android_artifact_name }}
          path: dist/android
      - name: Build disposable CI Android input otherwise
        if: inputs.android_bundle_run_id == ''
        shell: pwsh
        run: ./platforms/android/BUILD_ANDROID.ps1
        # This independent runner's key is NOT the maintainer's update key.
      - name: Verify actual APK and record release eligibility
        shell: pwsh
        env:
          SIGNED_INPUT_RUN: ${{ inputs.android_bundle_run_id }}
        run: |
          $options = @()
          if (-not $env:SIGNED_INPUT_RUN) { $options += '--allow-ci-certificate' }
          python tools/validate_android_build_input.py --output dist/android/build-input-validation.json @options
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-input-${{ github.sha }}
          path: |
            dist/android/ManageYourLibrary-*.apk
            dist/android/ManageYourLibrary-*.update.json
            dist/android/build-input-validation.json
          if-no-files-found: error

  macos:
    needs: android-input
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      MYL_EXPECTED_ARCH: ${{ matrix.arch }}
      MYL_MACOS_REQUIRE_DISTRIBUTION: '0'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Prepare pinned CPython 3.12.16 for the actual native architecture
        run: bash tools/setup_native_macos_python.sh
      - name: Build exact ONNX Runtime on native Intel when no official wheel exists
        if: matrix.arch == 'x64'
        run: bash tools/build_onnxruntime_macos_x64.sh
      - uses: actions/download-artifact@v4
        with:
          name: android-build-input-${{ github.sha }}
          path: dist/android
      - name: Compile and test native updater, then check the packaged archive
        run: bash platforms/macos/build_macos.sh
      - name: Keep QA candidate and compact provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myl-macos-${{ matrix.arch }}-QA-${{ github.sha }}
          path: |
            dist/native-release/*
            dist/macos/validation/*
            dist/macos/build-manifest.json
            dist/onnx-macos-x64/*
          if-no-files-found: warn
          compression-level: 0
