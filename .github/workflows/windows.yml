name: Windows validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build application
        shell: cmd
        run: platforms\windows\BUILD_WINDOWS.bat
        env:
          MANAGE_YOUR_LIBRARY_SKIP_INSTALL: '1'
          MANAGE_YOUR_LIBRARY_NO_PAUSE: '1'
      - name: Upload unpacked application
        uses: actions/upload-artifact@v4
        with:
          name: ManageYourLibrary-windows-x64
          path: dist/windows/ManageYourLibrary
