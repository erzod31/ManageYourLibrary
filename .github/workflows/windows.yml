name: Windows validation

on:
  push:
    branches: [main, codex/audit-optimizations]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m venv C:/myl-native-build/venv
          C:/myl-native-build/venv/Scripts/python.exe -m pip install --require-hashes -r requirements.lock
          'C:/myl-native-build/venv/Scripts' >> $env:GITHUB_PATH
          'MANAGE_YOUR_LIBRARY_PYTHON=C:/myl-native-build/venv/Scripts/python.exe' >> $env:GITHUB_ENV
      - name: Build isolated patched Tcl and Tk without profile paths
        run: python -B tools/build_accessible_tk.py --output C:/myl-native-build/gui
      - name: Build pinned OCR without legacy copyleft DLLs
        run: python -B tools/build_permissive_ocr.py --output dist/ocr
      - name: Verify OCR formats, models and TSV
        run: python -B tools/verify_ocr_functionality.py dist/ocr/payload --output dist/ocr-formats.json
      - name: Test
        run: python -B tools/run_tests.py
      - name: Evaluate versioned synthetic identity and OCR corpus
        run: python -B tools/evaluate_corpus.py --ocr
      - name: Build application
        shell: cmd
        run: platforms\windows\BUILD_WINDOWS.bat
        env:
          MANAGE_YOUR_LIBRARY_SKIP_INSTALL: '1'
          MANAGE_YOUR_LIBRARY_NO_PAUSE: '1'
      - name: Upload unpacked application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ManageYourLibrary-windows-x64
          path: dist/windows/ManageYourLibrary
